# Cloudflare Pages project for event.bali-hidup-agency.com
name = "hidup-community-event"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"

# RSVP database. Create it once with:
#   npx wrangler d1 create hidup-community-event
# then paste the printed database_id below.
[[d1_databases]]
binding = "DB"
database_name = "hidup-community-event"
database_id = "REPLACE_WITH_DATABASE_ID"
